name: Build Pixel Watch Fish Time

on:
  push:
    branches:
      - "pixel-watch-photo-fish"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Generate photo-real fish assets
        run: |
          python -m pip install --upgrade pip
          python -m pip install "Pillow>=11" requests "rembg[cpu]"
          python pixel-watch/tools/generate_pixel_fish.py

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.0"

      - name: Build debug APK
        working-directory: pixel-watch
        run: gradle :watchface:assembleDebug --no-daemon

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pixel-watch/watchface/src/main/res/drawable-nodpi
          git add pixel-watch/watchface/src/main/res/drawable/preview.png
          git add pixel-watch/watchface/src/main/res/raw/watchface.xml
          git add pixel-watch/ATTRIBUTIONS.csv
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Generate color photo fish assets for Pixel Watch"
            git push
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: fish-time-pixel-watch-debug
          path: pixel-watch/watchface/build/outputs/apk/debug/*.apk
